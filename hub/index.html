<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&display=swap" rel="stylesheet">
<style>
  :root.light .item .price,:root.light .mini .price,:root.light .cap .price,:root.light .sale,:root.light .hero.soon .d,:root.light .hero.soon .price{color:#b86f00;border-color:#b86f00}
  :root.light{--ink:#ecebe7;--paper:#0e0e0e;--mute:#6b6a65;--line:#cfcdc6;--row:#e1e0db;--card:#e1e0db;--card-h:#d8d7d1}

  :root{--card:#1b1b1a;--card-h:#232321;
    --ink:#0e0e0e; --paper:#ecebe7; --amber:#f4a62a; --amber-deep:#e08f0c;
    --mute:#8d8b85; --line:#2a2a28; --row:#171716;
    --sans:"Archivo","Helvetica Neue","Apple SD Gothic Neo","Hiragino Sans","Noto Sans CJK KR",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--paper);font:500 13px/1.45 var(--sans);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;word-break:keep-all;overflow-wrap:break-word}
  body{padding:8px 12px 10px;min-height:100vh;display:flex;flex-direction:column;gap:7px}

  header{display:flex;align-items:center;gap:10px}
  .logo{flex:none;width:40px;height:40px;background:var(--paper);color:var(--ink);display:grid;place-items:center;
    font:900 15px/1 var(--sans);letter-spacing:-.02em}
  .lead{flex:1;color:var(--mute);font-size:12px;line-height:1.3}
  .lang{display:flex;gap:2px}
  .lang button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);font:800 11px/1 var(--sans);
    padding:6px 5px;cursor:pointer}
  .lang button[aria-pressed="true"]{color:var(--paper);border-bottom-color:var(--amber)}
  button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  .hero{display:block;background:var(--amber);color:var(--ink);padding:12px 16px 12px;text-decoration:none;cursor:pointer;
    position:relative;transition:background .15s}
  .hero:hover{background:var(--amber-deep)}
  .hero .new{font:800 11px/1 var(--sans);background:var(--ink);color:var(--amber);display:inline-block;padding:4px 7px}
  .hero .name{display:block;font:900 clamp(34px,12vw,46px)/.92 var(--sans);letter-spacing:-.045em;margin:20px 0 8px}
  .hero.pic{padding:0;overflow:hidden}
  .hero.pic img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
  .hero.pic .cap{padding:9px 14px 10px}
  .hero.pic .new{margin-right:6px}
  .hero.pic .meta{margin-top:0}
  .hero.soon{background:var(--card);color:var(--paper);cursor:default}
  .hero.soon:hover{background:var(--card-h)}
  .hero.soon video,.hero.soon img{display:block;width:100%;aspect-ratio:2/1;object-fit:cover;background:#111}
  .hero.soon .new{background:var(--amber);color:var(--ink)}
  .hero.soon .t{font:900 20px/1 var(--sans);letter-spacing:-.02em}
  .hero.soon .d{color:var(--amber);font-size:12px;font-weight:800;line-height:1.3;margin-top:4px}
  .hero.soon .price{color:var(--amber)}
  .item.pic .name{font-size:16px}
  .item.pic .desc{margin-top:1px}
  .item.pic{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;padding-top:5px;padding-bottom:5px}
  .item.pic img{width:64px;aspect-ratio:16/9;object-fit:cover;display:block}
  .hero .desc{font-size:13px;line-height:1.35;max-width:26ch;font-weight:500}
  .hero .meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;font:800 13px/1 var(--sans)}

  .list{border-top:1px solid var(--line)}
  .item{display:block;padding:8px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;cursor:pointer;
    transition:background .12s,padding .12s}
  .item:hover{background:var(--row);padding-left:10px}
  .item .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .item .name{font:800 19px/1.1 var(--sans);letter-spacing:-.02em}
  .item .price{font:800 13px/1 var(--sans);color:var(--amber)}
  .item .desc{color:var(--mute);font-size:12px;margin-top:3px;max-width:36ch;line-height:1.35}

  .sec{display:flex;justify-content:space-between;align-items:baseline;font:800 10px/1 var(--sans);letter-spacing:.14em;color:var(--mute);text-transform:uppercase;margin:2px 0 -2px}
  .mini{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;cursor:pointer;transition:background .12s,padding .12s}
  .mini:hover{background:var(--row);padding-left:10px}
  .mini .name{font:800 15px/1.1 var(--sans);letter-spacing:-.01em}
  .mini .ver{color:var(--mute);font-size:11px}
  .mini .price{margin-left:auto;font:800 12px/1 var(--sans);color:var(--amber)}
  .badge{font:800 9.5px/1 var(--sans);letter-spacing:.04em;padding:3px 5px;border-radius:2px;white-space:nowrap}
  .badge.up{background:var(--amber);color:var(--ink)}
  .badge.new{background:var(--paper);color:var(--ink)}
  .badge.have{background:none;color:var(--mute);border:1px solid var(--line)}
  #devlist{border-top:1px solid var(--line)}
  .all{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--paper);color:var(--paper);
    padding:11px 14px;text-decoration:none;font:800 14px/1 var(--sans);cursor:pointer;transition:background .12s,color .12s}
  .all:hover{background:var(--paper);color:var(--ink)}
  .all svg{width:16px;height:16px}

  footer{margin-top:auto;padding-top:0;display:flex;justify-content:space-between;gap:8px;color:var(--mute);font-size:11px}
  footer b{font-weight:900;color:var(--paper);letter-spacing:-.01em;white-space:nowrap}
  footer .mail{user-select:all;-webkit-user-select:all;cursor:text}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>if(/[?&]theme=light/.test(location.search))document.documentElement.classList.add("light");</script>
</head>
<body>

<header>
  <div class="logo" aria-hidden="true">NEN</div>
  <p class="lead" data-t="lead"></p>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="en" aria-pressed="false">EN</button>
    <button data-lang="ko" aria-pressed="false">KO</button>
    <button data-lang="ja" aria-pressed="false">JA</button>
  </div>
</header>

<a class="hero" id="hero" role="link"></a>
<div class="sec"><span data-t="bundles"></span></div>
<div class="list" id="products"></div>
<div class="sec"><span data-t="devs"></span><span data-t="devnote"></span></div>
<div id="devlist"></div>
<a class="all" id="all" role="link"></a>

<footer>
  <b>NEN STUDIO</b>
  <span class="mail" title="Contact">haveagoodtripinfo@gmail.com</span>
</footer>

<script>
/* ===================================================================
   편집은 여기만:  PRODUCTS 배열 (hero:true 항목이 위 큰 주황 칸)
   가격/주소는 NEN STUDIO 사이트(nen-stuio.vercel.app)와 맞추기
   =================================================================== */
const SRC = "utm_source=hub&utm_medium=device";
const SITE = "https://nen-stuio.vercel.app/plug-ins/m4l";

const GR = "https://nodnxd.gumroad.com/l";
/* HUB가 넘겨주는 내 컴퓨터의 설치 버전: 주소 # 뒤 "have=id:설치:최신,..." (서버로 전송되지 않음) */
function vnum(v){ const p=String(v||"").replace(/^v/,"").split("."); return (+p[0]||0)*1e6+(+p[1]||0)*1e3+(parseInt(p[2],10)||0); }
function readHave(){
  const m = location.hash.match(/have=([^&]*)/), out = {};
  if (m) decodeURIComponent(m[1]).split(",").forEach(x=>{ const a=x.split(":"); if(a[0]) out[a[0]]={have:a[1]||"?",latest:a[2]||""}; });
  return out;
}
let HAVE = readHave();
window.addEventListener("hashchange", ()=>{ HAVE = readHave(); render(); });
const LIB = "https://app.gumroad.com/library";
/* 개별 디바이스: badge "up" = 업데이트됨, "new" = 신규, "" = 표시 없음 (버전 올릴 때 여기만 고치면 됨) */
const DEVICES = [
  { id:"setmonitor", name:"Set Monitor",   ver:"v4.11.1",  price:"$29", badge:"up",  url:SITE+"/set-monitor" },
  { id:"stripsilence", name:"Strip Silence", ver:"v1.5",   price:"$19", badge:"up",  url:SITE+"/strip-silence" },
  { id:"drumslicer", name:"Drum Slicer",   ver:"v1.2.0", price:"$29", badge:"up",  url:SITE+"/drum-slicer" },
  { id:"elsewhere", name:"Elsewhere",     ver:"v0.8",   price:"$29", badge:"",    url:SITE+"/elsewhere" },
  { id:"elsewhen", name:"Elsewhen",      ver:"v1.1", price:"$19", badge:"new", url:SITE+"/elsewhen" }
];
/* 맨 위 큰 칸: 곧 나올 제품 (없으면 SOON = null → NEN Complete 대신 hero 쓰려면 PRODUCTS에 hero:true) */
const SOON = { name:"Name Tag", price:"$8.40", was:"$12", url:GR+"/nametag/NAMETAG30",
  video:["../video/nametag-soon.webm","../video/nametag-soon.mp4"], poster:"../img/soon/nametag.jpg",
  tag:{ en:"Out now", ko:"출시", ja:"発売" },
  desc:{ en:"Launch sale −30% · code NAMETAG30 · until Dec 7, 2026",
         ko:"출시 기념 30% 할인 · 코드 NAMETAG30 · 2026년 12월 7일까지",
         ja:"発売記念30%オフ · NAMETAG30 · 2026/12/7まで" } };
/* HUB 1.6.3+는 오른쪽에 광고 칸(ad.html)을 따로 띄우고 주소에 side=2를 붙임 → 여기서는 Name Tag 칸을 빼고 NEN Complete를 위로 */
const SIDE = /[?&]side=2/.test(location.search);
const PRODUCTS = [
  { id:"complete", name:"NEN Complete", price:"$79", ver:"5 devices · save $46", hero:SIDE,
    tag:{ en:"New bundle", ko:"새 번들", ja:"新バンドル" },
    url:GR+"/complete", img:"../img/bundle/complete.jpg",
    desc:{ en:"All 5 NEN devices. Save $46.",
           ko:"NEN 디바이스 5개 전부. $46 할인.",
           ja:"NENの全5デバイス。$46お得。" } },
  { id:"spacetime", name:"Space & Time", price:"$39",
    url:GR+"/spacetime", img:"../img/bundle/spacetime.jpg",
    desc:{ en:"Elsewhere + Elsewhen. Save $9.",
           ko:"Elsewhere + Elsewhen. $9 할인.",
           ja:"Elsewhere + Elsewhen。$9お得。" } },
  { id:"cutslice", name:"Cut & Slice", price:"$39",
    url:GR+"/cutslice", img:"../img/bundle/cutslice.jpg",
    desc:{ en:"Strip Silence + Drum Slicer. Save $9.",
           ko:"Strip Silence + Drum Slicer. $9 할인.",
           ja:"Strip Silence + Drum Slicer。$9お得。" } }
];

const T = {
  en:{ lead:"HUB is free. These are our other devices for Ableton Live.", all:"See all plug-ins", newtag:"New", foot:"Drag in. No installer.", bundles:"Bundles", devs:"Devices", devnote:"", up:"Updated", nw:"New", have:"Installed", upd:"Update" },
  ko:{ lead:"HUB는 무료예요. Ableton Live용 다른 디바이스도 만나보세요.", all:"플러그인 전체 보기", newtag:"신규", foot:"끌어다 놓기만 하면 끝. 설치 프로그램 없음.", bundles:"번들", devs:"디바이스", devnote:"", up:"업데이트", nw:"신규", have:"설치됨", upd:"업데이트" },
  ja:{ lead:"HUBは無料です。Ableton Live用のほかのデバイスもどうぞ。", all:"すべてのプラグインを見る", newtag:"新着", foot:"ドラッグするだけ。インストーラー不要。", bundles:"バンドル", devs:"デバイス", devnote:"", up:"アップデート", nw:"新着", have:"インストール済み", upd:"アップデート" }
};

/* 외부 링크: Max jweb → 엔진 → 기본 브라우저. 일반 브라우저에선 새 탭 */
let LASTOPEN = {u:"", t:0};
function openExternal(url){
  const now = Date.now();                       // 같은 링크가 1초 안에 두 번 열리지 않게
  if (LASTOPEN.u === url && now - LASTOPEN.t < 1000) return;
  LASTOPEN = {u:url, t:now};
  try{
    if (window.max && typeof window.max.outlet === "function") { window.max.outlet("openurl", url); return; }
  }catch(e){}
  window.open(url, "_blank", "noopener");
}
function withSrc(u){ return u + (u.indexOf("?")>-1 ? "&" : "?") + SRC; }
function wire(a, url){
  a.href = withSrc(url);
  a.onclick = ev=>{ ev.preventDefault(); openExternal(a.href); };   // render()가 여러 번 돌아도 핸들러는 하나만
}

let LANG = "en";
try{
  const saved = localStorage.getItem("hub_lang");
  const nav = (navigator.language||"en").slice(0,2);
  LANG = saved || (T[nav] ? nav : "en");
}catch(e){}
if(!T[LANG]) LANG = "en";

function render(){
  const L = T[LANG];
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = L[el.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang===LANG)));

  const hero = document.getElementById("hero"), list = document.getElementById("products");
  hero.textContent = ""; list.textContent = "";
  if (SOON && !SIDE){
    hero.className = "hero pic soon";
    hero.innerHTML = '<video muted loop playsinline autoplay preload="auto"></video><div class="cap"><div class="meta"><span><span class="new"></span> <span class="t"></span></span><span class="price"></span></div><p class="d"></p></div>';
    const v = hero.querySelector("video"); v.poster = SOON.poster; v.setAttribute("aria-label", SOON.name);
    SOON.video.forEach(src=>{ const so=document.createElement("source"); so.src=src; so.type=src.endsWith(".webm")?"video/webm":"video/mp4"; v.appendChild(so); });
    v.addEventListener("error", ()=>{}, true);
    hero.querySelector(".new").textContent = SOON.tag[LANG]||SOON.tag.en;
    hero.querySelector(".t").textContent = SOON.name;
    hero.querySelector(".price").innerHTML = (SOON.was ? '<s style="color:var(--mute);font-weight:500;margin-right:6px">'+SOON.was+'</s>' : "") + SOON.price;
    hero.querySelector(".d").textContent = SOON.desc[LANG]||SOON.desc.en;
    if (SOON.url) { hero.style.cursor = "pointer"; wire(hero, SOON.url); } else hero.removeAttribute("role");
    v.play && v.play().catch(()=>{});
  }
  PRODUCTS.forEach(p=>{
    const d = p.desc[LANG] || p.desc.en;
    if (p.hero){
      if (p.img) { hero.classList.add("pic"); hero.innerHTML = '<img alt=""><div class="cap"><div class="meta"><span><span class="new"></span> <span class="ver"></span></span><span class="price"></span></div></div>'; hero.querySelector("img").src = p.img; hero.querySelector("img").alt = p.name; }
      else hero.innerHTML = '<span class="new"></span><span class="name"></span><p class="desc"></p><div class="meta"><span class="ver"></span><span class="price"></span></div>';
      hero.querySelector(".new").textContent = (p.tag && (p.tag[LANG]||p.tag.en)) || L.newtag;
      if (!p.img) { hero.querySelector(".name").textContent = p.name; hero.querySelector(".desc").textContent = d; }
      hero.querySelector(".ver").textContent = p.ver || "";
      hero.querySelector(".price").textContent = p.price;
      wire(hero, p.url);
    } else {
      const a = document.createElement("a"); a.className = "item"; a.setAttribute("role","link");
      if (p.img) { a.classList.add("pic"); a.innerHTML = '<img alt=""><div><div class="row"><span class="name"></span><span class="price"></span></div><p class="desc"></p></div>'; a.querySelector("img").src = p.img; }
      else a.innerHTML = '<div class="row"><span class="name"></span><span class="price"></span></div><p class="desc"></p>';
      a.querySelector(".name").textContent = p.name;
      a.querySelector(".price").textContent = p.price;
      a.querySelector(".desc").textContent = d;
      wire(a, p.url);
      list.appendChild(a);
    }
  });
  const dl = document.getElementById("devlist"); dl.textContent = "";
  DEVICES.forEach(d=>{
    const a = document.createElement("a"); a.className = "mini"; a.setAttribute("role","link");
    a.innerHTML = '<span class="name"></span><span class="ver"></span><span class="price"></span>';
    a.querySelector(".name").textContent = d.name; a.querySelector(".ver").textContent = d.ver; a.querySelector(".price").textContent = d.price;
    const h = HAVE[d.id];
    /* 설치 정보가 없을 때는 "New"만 표시 ("Updated"는 이미 받은 사람에게 헷갈려서 뺌) */
    let cls = d.badge === "new" ? "new" : "", txt = L.nw, url = d.url;
    if (h) {                                   // 설치돼 있음: 최신 여부로 표시 (최신 = HUB가 받은 값, 없으면 이 페이지의 버전)
      const latest = h.latest || d.ver;
      if (h.have !== "?" && vnum(h.have) < vnum(latest)) { cls = "up"; txt = L.upd + " v" + h.have.replace(/^v/,"") + " → v" + latest.replace(/^v/,""); url = LIB; }
      else { cls = "have"; txt = L.have + (h.have && h.have !== "?" ? " v" + h.have.replace(/^v/,"") : ""); }
      a.querySelector(".ver").textContent = "";
      a.querySelector(".price").textContent = "";
    }
    if (cls) { const b = document.createElement("span"); b.className = "badge " + cls; b.textContent = txt; a.insertBefore(b, a.querySelector(".price")); }
    wire(a, url); dl.appendChild(a);
  });
  const all = document.getElementById("all");
  all.innerHTML = '<span></span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 8h11M9 3l5 5-5 5"/></svg>';
  all.firstChild.textContent = L.all;
  wire(all, SITE);
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{
  LANG=b.dataset.lang; try{localStorage.setItem("hub_lang",LANG)}catch(e){} render();
}));
render();

window.addEventListener("storage", e=>{ if(e.key==="hub_lang"&&e.newValue&&e.newValue!==LANG){ LANG=e.newValue; render(); } });   // 두 칸 언어 같이 바뀌게
</script>
</body>
</html>
